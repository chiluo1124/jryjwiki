<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索 | 旧日余烬 WIKI</title><link rel="stylesheet" href="assets/style.css"></head><body>
<nav class="nav"><div class="nav-inner">
  <a class="brand" href="index.html"><span class="logo">余</span><div>旧日余烬WIKI<small>EMBER OF OLD</small></div></a>
  <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="搜索…" oninput="doSearch()"></div>
  <div class="nav-links" id="navLinks"></div></div></nav>
<main>
<div class="page-head"><div class="eyebrow">SEARCH</div><h1>搜索结果</h1><p id="queryLine"></p></div>
<div class="grid c2" id="resultsGrid"></div>
<div class="empty" id="empty" style="display:none">暂无匹配结果，换个关键词试试。</div>
</main>
<footer><div class="links"><a href="index.html">首页</a><a href="world.html">世界观</a><a href="paths.html">四途</a><a href="chars.html">人物</a><a href="factions.html">势力</a><a href="yanzai.html">魇灾</a><a href="places.html">地点</a><a href="items.html">物件</a><a href="quiz.html">测试</a><a href="chapters.html">章节</a><a href="about.html">关于</a></div>旧日余烬设定百科 · 由读者搭建，仅供学习交流</footer>
<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script src="assets/data.js"></script><script src="assets/common.js"></script>
<script>
function initPage(){
  const params = new URLSearchParams(location.search);
  const q = (params.get('q')||'').trim().toLowerCase();
  document.getElementById('q').value = q;
  document.getElementById('queryLine').textContent = q ? `关键词：「${q}」` : '未输入关键词';
  const grid = document.getElementById('resultsGrid');
  if(!q){ grid.innerHTML=''; document.getElementById('empty').style.display='block'; return; }
  const hits = getIdx().filter(x=>x.title.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q));
  grid.innerHTML = hits.length ? hits.map(h=>`
    <a class="card" href="${pageFor(h.cat)}" style="text-decoration:none;display:block">
      <div class="icon">🔍</div><h3>${h.title}</h3><p><small style="color:var(--accent3)">${h.type}</small> · ${strip(h.desc,120)}</p>
    </a>`).join('') : '';
  document.getElementById('empty').style.display = hits.length?'none':'block';
}
</script></body></html>
