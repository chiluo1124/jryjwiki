<script>
function renderFactions(aff){
  const grid = document.getElementById('factionGrid');
  const list = aff? factions.filter(f=>f.tag===aff || f.members&&f.members.includes(aff)) : factions;
  grid.innerHTML = factions.filter(f=> !aff || f.name.includes(aff) || (f.members||[]).some(m=>m.includes(aff)))
    .map(f=>{
      const mem = (f.members||[]).filter(m=> chars.some(c=>c.name===m)).map(m=>`<a href="chars.html" style="color:var(--accent3)">${m}</a>`).join("、");
      return `<div class="card"><span class="top">${f.tag}</span><div class="icon">🏛️</div><h3>${f.name}</h3><p>${f.desc}</p>${mem?`<p style="margin-top:8px;font-size:12px;color:var(--accent3)">成员：${mem}</p>`:''}</div>`;
    }).join("");
}
function initPage(){
  renderFactions();
  const tags = ["全部", ...new Set(factions.map(f=>f.tag))];
  renderChips('chips', tags, renderFactions);
  observeNums();
}
